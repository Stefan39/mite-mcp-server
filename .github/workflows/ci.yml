name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Server starts and refuses to run without configuration
        run: |
          if node dist/index.js 2> err.txt; then exit 1; fi
          grep -q "MITE_ACCOUNT is not set" err.txt
      - name: Build the Claude Desktop bundle (.mcpb)
        if: matrix.node == 22
        run: npm run bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == 22
        with:
          name: mcpb
          path: '*.mcpb'
          if-no-files-found: error
