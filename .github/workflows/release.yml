name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.5.0'
        required: true

permissions:
  contents: write

jobs:
  mcpb:
    name: Attach Claude Desktop bundle
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bundle
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          cp "mite-mcp-server-${version}.mcpb" mite-mcp-server.mcpb
          gh release upload "$TAG" "mite-mcp-server-${version}.mcpb" mite-mcp-server.mcpb --clobber
